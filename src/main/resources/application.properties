spring.application.name=carrent
server.port=${PORT:8080}
spring.profiles.active=${APP_PROFILE:json}

# Hibernate config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# PostgreSQL DataSource
spring.datasource.url=${DB_CONNECT_URL:}
spring.datasource.username=${DB_USER:neondb_owner}
spring.datasource.password=${DB_PASSWORD:npg_fY6QqhRV4BMP}
spring.datasource.driver-class-name=org.postgresql.Driver

# Logging
logging.level.root=WARN
logging.level.carrent=INFO